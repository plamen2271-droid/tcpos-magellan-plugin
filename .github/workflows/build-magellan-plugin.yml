name: Build Magellan TCPOS plugin

on:
  workflow_dispatch:  # run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) get the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2) install Mono + msbuild
      - name: Install Mono and msbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https dirmngr gnupg ca-certificates
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get update
          sudo apt-get install -y mono-complete msbuild

      # 3) build the project as plain .NET (CI doesn't have Xamarin.Android)
      - name: Build plugin (force net8.0 on CI)
        working-directory: .tcpos-magellan-plugin/BarcodeReaderMagellan.DroidPos
        run: |
          # backup original Xamarin csproj
          cp BarcodeReaderMagellan.DroidPos.csproj BarcodeReaderMagellan.DroidPos.csproj.bak
          # force to plain .NET so msbuild on ubuntu can build it
          sed -i 's/<TargetFramework>.*<\/TargetFramework>/<TargetFramework>net8.0<\/TargetFramework>/' BarcodeReaderMagellan.DroidPos.csproj
          # build
          msbuild /t:Rebuild /p:Configuration=Release
          # put original file back
          mv BarcodeReaderMagellan.DroidPos.csproj.bak BarcodeReaderMagellan.DroidPos.csproj

      # 4) upload whatever we produced
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: magellan-plugin-build
          path: |
            .tcpos-magellan-plugin/BarcodeReaderMagellan.DroidPos/bin/Release/**
